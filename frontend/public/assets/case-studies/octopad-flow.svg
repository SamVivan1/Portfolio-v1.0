<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="OCTOPAD architecture diagram">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#2a1b3d" stroke-width="1"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
  </marker>
</defs>
<rect width="1200" height="600" fill="#100b1c"/>
<rect width="1200" height="600" fill="url(#grid)" opacity="0.55"/>
<rect x="24" y="24" width="1152" height="552" fill="none" stroke="#3a284f" stroke-width="2"/>
<text x="56" y="74" fill="#f5efe0" font-size="24" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">OCTOPAD</text>
<text x="56" y="102" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">ESP32-C3  /  8 KEYS  /  BLE HID + USB SERIAL  /  NATIVE APPS</text>
<rect x="60" y="220" width="220" height="140" fill="#171126" stroke="#3a284f" stroke-width="2"/><rect x="60" y="220" width="8" height="140" fill="#fbbf24"/><text x="82" y="258" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">8 mechanical keys</text><text x="82" y="288" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">single click · double click</text><text x="82" y="312" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">long press · LED</text><rect x="320" y="195" width="220" height="180" fill="#171126" stroke="#3a284f" stroke-width="2"/><rect x="320" y="195" width="8" height="180" fill="#5eead4"/><text x="342" y="233" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">ESP32-C3</text><text x="342" y="263" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">BLE HID + USB Serial</text><text x="342" y="287" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">dual layer switch</text><text x="342" y="311" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">standalone HID mode</text><rect x="650" y="120" width="250" height="105" fill="#171126" stroke="#3a284f" stroke-width="2"/><rect x="650" y="120" width="8" height="105" fill="#c4b5fd"/><text x="672" y="158" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">Desktop mode</text><text x="672" y="188" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">shortcuts · navigation</text><rect x="650" y="265" width="250" height="105" fill="#171126" stroke="#3a284f" stroke-width="2"/><rect x="650" y="265" width="8" height="105" fill="#f472b6"/><text x="672" y="303" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">Home Assistant</text><text x="672" y="333" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">REST calls · IoT actions</text><rect x="650" y="410" width="250" height="105" fill="#171126" stroke="#3a284f" stroke-width="2"/><rect x="650" y="410" width="8" height="105" fill="#5eead4"/><text x="672" y="448" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">Native apps</text><text x="672" y="478" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">GTK4 · PySide6 / Qt6</text><text x="672" y="502" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">profiles · event monitor</text><rect x="320" y="430" width="220" height="85" fill="#171126" stroke="#3a284f" stroke-width="2" stroke-dasharray="8 7"/><rect x="320" y="430" width="8" height="85" fill="#fbbf24"/><text x="342" y="468" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">No web server</text><text x="342" y="498" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">no Docker · no daemon</text><path d="M 280 290 L 320 290" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 540 240 L 650 172" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="552" y="220" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">BLE</text><path d="M 540 320 L 650 317" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="552" y="308" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">BLE</text><path d="M 540 350 L 600 350 L 600 462 L 650 462" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="548" y="392" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">serial</text><text x="60" y="400" fill="#fbbf24" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">DUAL LAYER</text><text x="60" y="540" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">The pad keeps working after the config app closes.</text>
<text x="56" y="560" fill="#9b8fb3" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">SAMVIVAN.MY.ID  /  CASE STUDY</text>
<text x="1144" y="560" fill="#fbbf24" font-size="13" font-weight="400" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">OPEN SOURCE</text>
</svg>
