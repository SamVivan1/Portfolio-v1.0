nt-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">IF node</text><rect x="920" y="130" width="210" height="100" fill="#171126" stroke="#3a284f" stroke-width="2" stroke-dasharray="8 7"/><rect x="920" y="130" width="8" height="100" fill="#5eead4"/><text x="942" y="168" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">Update file</text><text x="942" y="198" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">existing workflow</text><rect x="920" y="290" width="210" height="100" fill="#171126" stroke="#3a284f" stroke-width="2" stroke-dasharray="8 7"/><rect x="920" y="290" width="8" height="100" fill="#5eead4"/><text x="942" y="328" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">Upload file</text><text x="942" y="358" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">new workflow</text><rect x="710" y="430" width="420" height="90" fill="#171126" stroke="#3a284f" stroke-width="2"/><rect x="710" y="430" width="8" height="90" fill="#f472b6"/><text x="732" y="468" fill="#f5efe0" font-size="20" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">Git history</text><text x="732" y="498" fill="#9b8fb3" font-size="15" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">one JSON per workflow · timestamped commit</text><path d="M 220 255 L 260 255" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 450 255 L 490 255" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 670 255 L 710 255" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 870 230 L 920 180" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="208" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">true</text><path d="M 870 280 L 920 340" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="322" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">false</text><path d="M 1130 180 L 1155 180 L 1155 475 L 1130 475" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1025 390 L 1025 430" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="520" fill="#9b8fb3" font-size="14" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">No manual exports after the initial setup.</text>
