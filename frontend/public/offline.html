<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08070f" />
    <meta name="robots" content="noindex" />
    <title>Offline — A Night in the Homelab</title>
    <style>
      :root {
        --void: #08070f;
        --night: #120d1f;
        --line: #3a284f;
        --cream: #f5efe0;
        --muted: #9b8fb3;
        --teal: #5eead4;
        --amber: #fbbf24;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--cream);
        background:
          radial-gradient(circle at 50% 28%, rgba(139, 92, 246, 0.16), transparent 54%),
          var(--void);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(196, 181, 253, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(196, 181, 253, 0.06) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(circle at 50% 40%, black, transparent 72%);
        pointer-events: none;
      }
      main {
        position: relative;
        width: min(620px, 100%);
        padding: 30px;
        border: 2px solid var(--line);
        background: rgba(23, 17, 38, 0.96);
        box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.45);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .brand img {
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      .eyebrow {
        margin: 26px 0 8px;
        color: var(--amber);
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.6rem, 5vw, 2.6rem);
        line-height: 1.1;
        text-wrap: balance;
      }
      p {
        max-width: 56ch;
        margin: 0;
        color: #d9cfe6;
        font-size: 16px;
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 15px;
        border: 2px solid var(--line);
        background: var(--night);
        color: var(--cream);
        font: inherit;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border-color: var(--teal);
        background: var(--teal);
        color: var(--void);
      }
      button:hover,
      a:hover {
        border-color: var(--cream);
      }
      .meta {
        margin-top: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 600px) {
        main {
          padding: 22px 18px;
          box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.45);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/assets/logo-pixel.svg" alt="" aria-hidden="true" />
        <span>BSP://HOMELAB</span>
      </div>
      <p class="eyebrow">OFFLINE · SIGNAL LOST</p>
      <h1>The homelab is unreachable.</h1>
      <p>
        This page is not in the offline cache. Reconnect to the network, then
        try again. Cached pages and the last visited route may still be
        available.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/">Back to the desk</a>
      </div>
      <p class="meta">A Night in the Homelab · offline fallback</p>
    </main>
  </body>
</html>
