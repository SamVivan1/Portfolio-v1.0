name: CI/CD Pipeline - Frontend

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      drill:
        description: "Force a smoke-test failure to exercise rollback"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  NEXT_PUBLIC_SITE_URL: https://samvivan.my.id
  IMAGE_NAME: ghcr.io/samvivan1/portfolio

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  build-image:
    name: Build image
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep only the current and previous image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: portfolio
          package-type: container
          min-versions-to-keep: 2

  deploy:
    name: Deploy
    needs: [verify, build-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://samvivan.my.id
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Pull, health check, smoke test, rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.0.111
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -eu

            BASE_URL="http://localhost:3003"
            COMPOSE_FILE="docker-compose.prod.yaml"
            CONTAINER="portfolio-prod"
            TARGET_SHA="${{ github.sha }}"
            IMAGE="ghcr.io/samvivan1/portfolio:${TARGET_SHA}"
            DRILL="${{ github.event.inputs.drill || 'false' }}"
            GHCR_TOKEN="${{ github.token }}"
            GHCR_ACTOR="${{ github.actor }}"

            cd /home/samvivan/portfolio/Portfolio-v1.0
            git fetch origin main
            git reset --hard "$TARGET_SHA"
            cd frontend

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              CURRENT_IMAGE=$(docker inspect -f '{{.Image}}' "$CONTAINER")
              docker tag "$CURRENT_IMAGE" portfolio:previous
              echo "Saved the running image as portfolio:previous."
            elif docker image inspect portfolio:latest >/dev/null 2>&1; then
              docker tag portfolio:latest portfolio:previous
              echo "Saved portfolio:latest as portfolio:previous."
            else
              echo "No previous image found; rollback is unavailable for this deploy."
            fi

            wait_for_health() {
              attempt=1
              health_state="missing"
              while [ "$attempt" -le 40 ]; do
                health_state=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "missing")
                if [ "$health_state" = "healthy" ]; then
                  echo "Container healthy after $attempt checks."
                  return 0
                fi
                if [ "$health_state" = "unhealthy" ]; then
                  echo "Container reported unhealthy after $attempt checks."
                  return 1
                fi
                attempt=$((attempt + 1))
                sleep 3
              done
              echo "Container did not become healthy in time (last state: $health_state)."
              return 1
            }

            rollback() {
              if ! docker image inspect portfolio:previous >/dev/null 2>&1; then
                echo "::error::No previous image is available; manual intervention required."
                return 1
              fi

              echo "Rolling back to portfolio:previous..."
              docker tag portfolio:previous portfolio:latest
              NEXT_PUBLIC_SITE_URL="https://samvivan.my.id" \
                docker compose -f "$COMPOSE_FILE" up -d --no-build

              if wait_for_health && SMOKE_FORCE_FAIL=0 bash scripts/smoke-deploy.sh "$BASE_URL"; then
                echo "Rollback passed health and smoke checks."
                return 0
              fi

              echo "::error::Rollback failed health or smoke checks."
              return 1
            }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            if ! docker pull "$IMAGE"; then
              echo "::error::Could not pull $IMAGE from GHCR."
              docker logout ghcr.io >/dev/null 2>&1 || true
              exit 1
            fi
            docker logout ghcr.io >/dev/null 2>&1 || true
            docker tag "$IMAGE" portfolio:latest

            if ! NEXT_PUBLIC_SITE_URL="https://samvivan.my.id" \
              docker compose -f "$COMPOSE_FILE" up -d --no-build; then
              echo "::error::Container could not be started."
              rollback || true
              exit 1
            fi

            if ! wait_for_health; then
              echo "::error::New container failed its health check."
              rollback || true
              exit 1
            fi

            if [ "$DRILL" = "true" ]; then
              echo "::warning::Rollback drill requested: forcing a smoke-test failure."
              export SMOKE_FORCE_FAIL=1
            fi

            if ! bash scripts/smoke-deploy.sh "$BASE_URL"; then
              echo "::error::New container failed smoke tests."
              rollback || true
              exit 1
            fi

            docker ps --filter "name=$CONTAINER" \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            # Keep the current commit image and the previous rollback image;
            # drop older GHCR tags so the homelab disk does not grow forever.
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep '^ghcr.io/samvivan1/portfolio:' \
              | grep -v ":${TARGET_SHA}$" \
              | xargs -r docker rmi >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            echo "Deploy verified and live."

      - name: Public edge check
        continue-on-error: true
        run: |
          set -eu
          edge_ok=true
          curl -fsS --max-time 20 https://samvivan.my.id/sitemap.xml \
            | grep -Fq "https://samvivan.my.id" || edge_ok=false
          curl -fsS --max-time 20 https://samvivan.my.id/ \
            | grep -Fq 'rel="canonical" href="https://samvivan.my.id"' || edge_ok=false

          if [ "$edge_ok" = "true" ]; then
            echo "Public domain check passed."
          else
            echo "::warning::Public edge check was blocked or stale; the origin smoke test already passed."
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deploy summary"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Target: https://samvivan.my.id"
            echo "- Result: ${{ job.status }}"
            echo "- Mode: ${{ github.event.inputs.drill == 'true' && 'rollback drill' || 'normal deploy' }}"
          } >> "$GITHUB_STEP_SUMMARY"
